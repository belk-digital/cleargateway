services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: belk
      POSTGRES_PASSWORD: belk
      POSTGRES_DB: belkpay
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belk -d belkpay"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  # Local chain for the worker E2E tests. Chain id 84532 so the stack (which only accepts Base Sepolia) runs unchanged.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "84532"]
    ports: ["8545:8545"]
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      retries: 10
  # Tooling only: docker compose run --rm foundry "forge test"
  foundry:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles: ["tools"]
    user: "0:0"
    working_dir: /work
    volumes:
      - ./contracts:/work
      - foundry-svm:/root/.svm
      - foundry-cache:/root/.foundry
volumes:
  pgdata:
  foundry-svm:
  foundry-cache:
